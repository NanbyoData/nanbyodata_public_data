# research-activities/ の MD が push されたときに research-activities.json を生成し、リポジトリにコミットする
name: Build research-activities.json

on:
  push:
    paths:
      - 'research-activities/**'
      - 'scripts/build_research_activities_json.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Build research-activities.json
        run: python scripts/build_research_activities_json.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/research-activities.json
          git diff --staged --quiet || (git commit -m "chore: update research-activities.json from research-activities" && git push)
